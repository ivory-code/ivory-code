      .pot { fill: #be9277; }
      .rim { fill: #9a785f; }
    }
  </style>
  <rect class="stem" x="16" y="8" width="4" height="20" />
  <rect class="leaf" x="4" y="8" width="12" height="8" />
  <rect class="leaf" x="4" y="4" width="8" height="4" />
  <rect class="stem" x="20" y="4" width="12" height="8" />
  <rect class="stem" x="24" y="0" width="8" height="4" />
  <rect class="rim" x="8" y="28" width="20" height="4" />
  <rect class="pot" x="12" y="32" width="12" height="8" />
