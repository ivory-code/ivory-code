<svg xmlns="http://www.w3.org/2000/svg" width="40" height="44" viewBox="0 0 40 44" shape-rendering="crispEdges">
  <style>
    .stem { fill: #48714c; }
    .leaf { fill: #759865; }
    .pot { fill: #ad866d; }
    .rim { fill: #8e6d59; }
    @media (prefers-color-scheme: dark) {
      .stem { fill: #8cac78; }
